[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-signal-hub"
version = "0.4.0"
description = "恶意样本静态 AI 信号、报告事件证据、知识库与统计报告统一平台"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "fastapi>=0.116",
  "httpx>=0.28",
  "jinja2>=3.1",
  "jsonschema>=4.20",
  "lxml>=5.3",
  "pdfplumber>=0.11",
  "python-magic>=0.4; platform_system != 'Windows'",
  "python-multipart>=0.0.20",
  "PyYAML>=6",
  "requests>=2.31",
  "scikit-learn>=1.7",
  "scipy>=1.11",
  "streamlit>=1.57",
  "uvicorn[standard]>=0.35"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6"]

[project.scripts]
ai-signal-api = "ai_signal_hub.main:run"
ai-signal-import = "ai_signal_hub.importer:main"
aisig = "aisig.cli:main"
reportctl = "report_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
